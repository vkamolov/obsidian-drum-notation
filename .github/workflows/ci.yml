name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Build web playground
        run: npm run web:build

      - name: Typecheck web playground
        run: npm run web:typecheck

      - name: Verify agent plugin and security invariants
        run: |
          npm run check:agent-plugin
          npm run security:style-sinks
          npm run check:third-party

      - name: Package and verify OpenAI directory submission
        run: |
          npm run agent-plugin:package
          npm run check:openai-submission

      - name: Install browser test engines
        run: npx playwright install --with-deps chromium webkit

      - name: Test production CSP and verifier
        run: npm run web:test:csp
