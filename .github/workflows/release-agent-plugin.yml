name: Release agent plugin

on:
  push:
    tags:
      - "agent-plugin-v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify importer tag
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(node -p "require('./agent-plugin/drum-notation-importer/metadata.json').version")"
          expected="agent-plugin-v${version}"
          if ! printf '%s' "$tag" | grep -Eq '^agent-plugin-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag $tag is not an exact importer tag like agent-plugin-v0.1.0" >&2
            exit 1
          fi
          if [ "$tag" != "$expected" ]; then
            echo "Tag $tag does not match importer version $version" >&2
            exit 1
          fi

      - name: Build and verify all shared surfaces
        run: |
          npm test
          npm run build
          npm run web:build
          npm run web:typecheck
          npm run check:agent-plugin
          npm run security:style-sinks
          npm run check:third-party
          npm audit --omit=dev

      - name: Install browser test engines
        run: npx playwright install --with-deps chromium webkit

      - name: Verify production CSP
        run: npm run web:test:csp

      - name: Package agent plugin
        run: |
          npm run agent-plugin:package
          npm run check:openai-submission

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/agent-plugin/drum-notation-importer-*.tar.gz
            dist/agent-plugin/drum-notation-importer-*.zip

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title "$tag" \
            --draft \
            --latest=false \
            --generate-notes \
            dist/agent-plugin/drum-notation-importer-*.tar.gz \
            dist/agent-plugin/drum-notation-importer-*.zip
